name: Deploy to Azora VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://code.azoralang.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate deployment key
        env:
          AZORA_SSH_PRIVATE_KEY: ${{ secrets.AZORA_SSH_PRIVATE_KEY }}
        run: |
          test -n "${AZORA_SSH_PRIVATE_KEY}" || {
            echo "::error::Missing required production secret AZORA_SSH_PRIVATE_KEY"
            exit 1
          }

      - name: Set up SSH
        env:
          AZORA_SSH_PRIVATE_KEY: ${{ secrets.AZORA_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${AZORA_SSH_PRIVATE_KEY}" > ~/.ssh/azora_deploy
          chmod 600 ~/.ssh/azora_deploy
          ssh-keyscan -H 152.239.116.142 >> ~/.ssh/known_hosts

      - name: Deploy to Azora VPS
        run: >
          rsync -rlptDz --delete --exclude='.htaccess'
          -e "ssh -i ~/.ssh/azora_deploy -o IdentitiesOnly=yes"
          dist/ azora-deploy@152.239.116.142:/var/www/code.azoralang.org/html/

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/azora_deploy
