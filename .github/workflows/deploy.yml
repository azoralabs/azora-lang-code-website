name: Deploy to Azora VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Only this repository may deploy to code.azoralang.org. A copy of this
    # workflow in another repository (for example a site started from this
    # one) skips the job instead of overwriting the production site.
    if: github.repository == 'azoralabs/azora-lang-code-website'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://code.azoralang.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate deployment key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "${DEPLOY_SSH_PRIVATE_KEY}" || {
            echo "::error::Missing required production secret DEPLOY_SSH_PRIVATE_KEY"
            exit 1
          }

      - name: Set up SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/azora_deploy
          chmod 600 ~/.ssh/azora_deploy
          ssh-keygen -y -f ~/.ssh/azora_deploy > /dev/null
          printf '%s\n' \
            '152.239.116.142 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHyErlb4oDnC/OkQn46xal1tIlNhbba6t3Xvjh3Tcjth' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # On the server this key can only run rrsync rooted at
      # /var/www/code.azoralang.org, so "html/" means /var/www/code.azoralang.org/html.
      - name: Deploy to Azora VPS
        run: >
          rsync -rlptDz --delete --exclude='.htaccess'
          -e "ssh -i ~/.ssh/azora_deploy -o IdentitiesOnly=yes"
          dist/ azora-deploy@152.239.116.142:html/

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/azora_deploy
