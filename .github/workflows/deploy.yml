name: Deploy to Azora VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://code.azoralang.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Azora VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -rlptDz --delete --exclude='.htaccess'
          path: dist/
          remote_path: /var/www/code.azoralang.org/html/
          remote_host: 152.239.116.142
          remote_port: ${{ secrets.VPS_PORT || secrets.HOSTINGER_PORT || '22' }}
          remote_user: ${{ secrets.VPS_USER || secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY || secrets.HOSTINGER_SSH_KEY }}
